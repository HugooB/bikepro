# Runs the published image (amd64 and arm64). Pin a version for predictable updates, for example
# ghcr.io/hugoob/bikepro:0.6. To build from source instead, add docker-compose.build.yml:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: "bikepro"

services:
  bikepro:
    image: ghcr.io/hugoob/bikepro:latest
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - bikepro-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bikepro-data:
