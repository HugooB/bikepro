name: "bikepro"

services:
  bikepro:
    build: .
    image: bikepro:latest
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - bikepro-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bikepro-data:
