name: Publish Docker image

# Publishes ghcr.io/hugoob/bikepro for amd64 and arm64 (Raspberry Pi) on every release tag.
# Run it by hand ("Run workflow") to build an image for an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.6.0
        required: true

permissions:
  contents: read

env:
  # ghcr.io only accepts lowercase names.
  IMAGE: ghcr.io/hugoob/bikepro
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: docker-${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # Native runners for both: much faster than emulating ARM, and the health check below
    # runs on the real architecture.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=BikePro
            org.opencontainers.image.description=Self-hosted maintenance tracker for your bikes: part wear, service history and costs.
            org.opencontainers.image.licenses=MIT

      # Build into the local Docker first and make sure it starts, so a broken image is never
      # published. On arm64 this also proves the better-sqlite3 native module loads.
      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: bikepro:test
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Check that it starts and reports healthy
        run: |
          docker run -d --name bikepro-test -p 3000:3000 bikepro:test
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          echo "BikePro didn't report healthy within two minutes:"
          docker logs bikepro-test
          exit 1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again (all layers come from the cache), pushed without a tag. The merge
      # job puts both architectures under one tag.
      - id: push
        name: Push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Save the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag the multi-arch image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.6.0 and 0.6 always; latest only for releases, not for pre-releases like v0.7.0-rc.1.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}

      # The annotations describe the image on its ghcr.io page and link it to this repository.
      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${{ env.IMAGE }}@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=Self-hosted maintenance tracker for your bikes: part wear, service history and costs." \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            "${sources[@]}"

      - name: Show the result
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
