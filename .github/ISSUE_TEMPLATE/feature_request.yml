name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/HugooB/bikepro#roadmap) and existing issues first: your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, e.g. "I ride two wheelsets on one bike and…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like BikePro to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now instead?
      description: Workarounds or other tools you use.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
