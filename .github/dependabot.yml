version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch updates; major updates get their own PR.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node LTS line in .nvmrc; move to the next LTS by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
